server:
  listen: ":8080"
  # Optional Torznab API keys. Leave empty for public access.
  torznab_api_keys:
    - example-key

database:
  type: sqlite
  path: "./magnet-atlas.db"

# PostgreSQL example:
# database:
#   type: postgres
#   url: postgres://magnet_atlas:secret@localhost:5432/magnet_atlas?sslmode=disable

ingestion:
  interval: 30m

sources:
  - name: sample-fixture
    type: fixture
    enabled: true
    fixture_path: ./testdata/sample-fixture.json
  - name: showrss
    type: rss
    enabled: false
    feed_url: https://showrss.info/rss?user=example
  - name: 1337x
    type: 1337x
    enabled: false
    base_url: https://www.1337xx.to
    categories:
      - movies
      - tv
    page_window: 20
    concurrency: 4
    request_delay: 1s
  - name: uindex
    type: uindex
    enabled: false
    base_url: https://uindex.org
    categories:
      - movies
      - tv
    page_window: 20
    concurrency: 4
  - name: ubuntu-releases
    type: linux-releases
    enabled: false
    base_url: https://releases.ubuntu.com/
